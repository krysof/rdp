[package]
name = "ironrdp-iwa"
version = "1.1.0"
description = "IronRDP WebAssembly bindings for Isolated Web Apps and Direct Sockets"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
doctest = false
test = false
crate-type = ["cdylib", "rlib"]

[features]
default = ["panic_hook"]
panic_hook = ["iron-remote-desktop/panic_hook"]
qoi = ["ironrdp/qoi"]
qoiz = ["ironrdp/qoiz"]

[dependencies]
ironrdp = { path = "../../vendor/IronRDP/crates/ironrdp", features = [
    "connector", "session", "input", "graphics", "dvc", "cliprdr",
    "rdpdr", "rdpsnd", "svc", "displaycontrol", "pdu",
] }
ironrdp-core.path = "../../vendor/IronRDP/crates/ironrdp-core"
ironrdp-cliprdr-format.path = "../../vendor/IronRDP/crates/ironrdp-cliprdr-format"
ironrdp-futures.path = "../../vendor/IronRDP/crates/ironrdp-futures"
ironrdp-pdu.path = "../../vendor/IronRDP/crates/ironrdp-pdu"
ironrdp-propertyset.path = "../../vendor/IronRDP/crates/ironrdp-propertyset"
ironrdp-rdpfile.path = "../../vendor/IronRDP/crates/ironrdp-rdpfile"
ironrdp-svc.path = "../../vendor/IronRDP/crates/ironrdp-svc"
iron-remote-desktop.path = "../../vendor/IronRDP/crates/iron-remote-desktop"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.6"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData", "Navigator",
    "Performance", "ReadableStream", "Window", "WritableStream",
    "Storage",
] }
js-sys = "0.3"
gloo-net = { version = "0.7", default-features = false, features = ["http", "io-util"] }
gloo-timers = { version = "0.4", default-features = false, features = ["futures"] }

futures-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
oxitls-rustcrypto-provider = "0.3"
rustls-pki-types = { version = "1", features = ["web"] }

png = "0.18"
resize = { version = "0.8", features = ["std"], default-features = false }
rgb = "0.8"

getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
chrono = { version = "0.4", features = ["wasmbind"] }
time = { version = "0.3", features = ["wasm-bindgen"] }

futures-util = { version = "0.3", features = ["sink", "io"] }
futures-channel = "0.3"
tracing = { version = "0.1", features = ["log"] }
anyhow = "1"
smallvec = "1.15"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
tap = "1"
semver = "1"
url = "2.5"
base64 = "0.22"
sha2 = "0.10"
