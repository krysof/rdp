name: Release signed IWA

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ironrdp-iwa -> target
          cache-on-failure: true

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Restore signing key
        env:
          IWA_SIGNING_KEY_B64: ${{ secrets.IWA_SIGNING_KEY_B64 }}
        run: |
          test -n "$IWA_SIGNING_KEY_B64"
          printf '%s' "$IWA_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/rdp-iwa-key.pem"
          chmod 600 "$RUNNER_TEMP/rdp-iwa-key.pem"

      - name: Create signed web bundle
        env:
          IWA_SIGNING_KEY: ${{ runner.temp }}/rdp-iwa-key.pem
        run: npm run package:iwa

      - name: Show bundle identity
        run: npx wbn-sign info rdp.swbn

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          rdp.swbn#rdp.swbn
          --title "RDP IWA ${GITHUB_REF_NAME}"
          --generate-notes
